<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d4d3d">
  <title>404 Not Found | Y.E.R.T.</title>
  <link rel="icon" type="image/png" href="assets/yert-logo.png">

  <!-- Existing Y.E.R.T. website files -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- 404 page design only -->
  <style>
    .yert-error {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 15%, rgba(185,238,130,.16), transparent 28%),
        radial-gradient(circle at 88% 85%, rgba(227,54,47,.10), transparent 25%),
        #f5f7f3;
    }

    .yert-error::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      border: 1px solid rgba(13,77,61,.08);
      border-radius: 50%;
      top: -270px;
      right: -180px;
    }

    .yert-error::after {
      content: "";
      position: absolute;
      width: 430px;
      height: 430px;
      border: 1px solid rgba(13,77,61,.07);
      border-radius: 50%;
      bottom: -260px;
      left: -170px;
    }

    .error-wrap {
      width: min(820px, 100%);
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .error-card {
      padding: 42px 38px 38px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(13,77,61,.10);
      border-radius: 28px;
      box-shadow: 0 25px 70px rgba(8,51,40,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .error-gif {
      display: block;
      width: min(360px, 78vw);
      height: auto;
      max-height: 300px;
      object-fit: contain;
      margin: 0 auto 24px;
      border-radius: 20px;
    }

    .error-code {
      margin: 0;
      font-size: clamp(4.8rem, 13vw, 8rem);
      line-height: .85;
      font-weight: 900;
      letter-spacing: -.08em;
      color: #0d4d3d;
    }

    .error-title {
      margin: -65px 0 8px;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      color: #183d33;
      letter-spacing: -.03em;
    }

    .error-message {
      max-width: 500px;
      margin: 0 auto;
      color: #6b7c76;
      font-size: .9rem;
      line-height: 1.65;
    }

    .error-accent {
      width: 58px;
      height: 4px;
      margin: 20px auto 24px;
      border-radius: 99px;
      background: linear-gradient(90deg, #8bd34d, #e3362f);
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 145px;
      margin-top: 24px;
      padding: 12px 22px;
      border-radius: 11px;
      background: #0d4d3d;
      color: #fff;
      text-decoration: none;
      font-size: .8rem;
      font-weight: 800;
      box-shadow: 0 9px 22px rgba(13,77,61,.18);
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .home-button:hover {
      transform: translateY(-2px);
      background: #17634f;
      box-shadow: 0 13px 28px rgba(13,77,61,.22);
    }

    .error-label {
      margin-top: 18px;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #91a09b;
    }

    @media (max-width: 600px) {
      .yert-error {
        padding: 18px 14px;
      }

      .error-card {
        padding: 30px 20px 28px;
        border-radius: 22px;
      }

      .error-gif { 
        width: min(290px, 78vw);
        margin-bottom: 0px;
      }

      .error-message {
        font-size: .82rem;
      }
    }
  </style>
</head>

<body>
  <main class="yert-error">
    <div class="error-wrap">
      <section class="error-card">

        <!-- Environment-themed animated 404 GIF -->
        <img
          class="error-gif"
          src="https://cdnl.iconscout.com/lottie/premium/thumb/404-http-not-found-animation-gif-download-4073222.gif"
          alt="Animated environment-themed 404 error">

        <h1 class="error-title">Page Not Found</h1>

        <div class="error-accent"></div>

        <p class="error-message">
          Oops! This page seems to have wandered off.
          Let's get you back to the Y.E.R.T. homepage.
        </p>

        <a class="home-button" href="index">
          <i class="fa-solid fa-house"></i>
          HOME
        </a>

        <p class="error-label">Youth Environment &amp; Emergency Response Team</p>
      </section>
    </div>
  </main>
</body>
</html>
