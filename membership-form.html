<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Form</title>
  <style>
    /* Tatanggalin ang margin at padding para walang puting space sa paligid */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Tatanggalin ang double scrollbar */
    }

    /* Gagawing buong laki ng screen ang iframe */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeiVKPWF0KSi2ocVoOIwMOyCnpcM5bSQASRTSSU-mzpHHJL6Q/viewform?embedded=true"></iframe>

</body>
</html>
